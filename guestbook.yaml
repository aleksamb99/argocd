apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook
  namespace: argocd
  labels:
    name: guestbook
spec:
  project: default

  source:
#    repoURL: https://github.com/lm-academy/argocd-example-apps.git
    repoURL: https://github.com/aleksamb99/argocd.git
    targetRevision: HEAD
    path: guestbook

  destination:
    server: https://kubernetes.default.svc
    namespace: default