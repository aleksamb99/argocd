apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook
  namespace: argocd
  labels:
    name: guestbook
spec:
  project: default
  syncPolicy:
    automated: {}

  source:
#    repoURL: https://github.com/lm-academy/argocd-example-apps.git
    repoURL: https://github.com/aleksamb99/argocd.git
#    path: guestbook
    targetRevision: HEAD
#    repoURL: https://github.com/argoproj/argocd-example-apps
    path: helm-guestbook
    helm:
      valueFiles:
        - values-custom.yaml
      valuesObject:
        replicaCount: 2
        service:
          type: NodePort
      parameters:
        - name: replicaCount
          value: '2'

  destination:
    server: https://kubernetes.default.svc
    namespace: default