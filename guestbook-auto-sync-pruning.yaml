apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook
  namespace: argocd
  labels:
    name: guestbook
spec:
  project: default
  syncPolicy:
    automated:
      prune: true

  source:
    repoURL: https://github.com/aleksamb99/argocd.git
    targetRevision: HEAD
    path: helm-guestbook
    helm:
      valueFiles:
        - values-custom.yaml
      valuesObject:
        replicaCount: 2
        service:
          type: NodePort
      parameters:
        - name: replicaCount
          value: '2'

  destination:
    server: https://kubernetes.default.svc
    namespace: default